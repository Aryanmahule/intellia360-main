name: Backend — build & deploy to EC2

# Pull requests: install, type-check and build the API (no deploy).
# Push to main:  the same checks, then deploy apps/backend to EC2.
#
# No AWS keys are stored in GitHub. The deploy job exchanges GitHub's OIDC token
# for a short-lived IAM role, then runs deploy/deploy.sh on the instance through
# SSM Run Command, so the EC2 security group needs no inbound SSH.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secret   AWS_DEPLOY_ROLE_ARN   IAM role trusted for this repo's OIDC token
#   variable AWS_REGION            e.g. ap-south-1
#   variable EC2_INSTANCE_ID       e.g. i-0123456789abcdef0
# API secrets (DATABASE_URL, AUTH_JWT_SECRET, …) live only on the instance in
# /srv/intellia360/shared/.env — see docs/DEPLOYMENT-AWS.md.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "deploy/deploy.sh"
      - "deploy/ecosystem.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "deploy/deploy.sh"
      - "deploy/ecosystem.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check
        run: |
          npm run typecheck -w @intellia360/shared
          npx tsc --noEmit -p apps/backend

      - name: Build
        run: npm run build:backend
        env:
          # Placeholders so the build can load modules that validate config at
          # import time. The artifact is discarded; the instance builds with its
          # own production environment.
          AUTH_JWT_SECRET: ci-build-only-placeholder-not-a-real-secret-0123456789
          DATABASE_URL: mongodb://127.0.0.1:27017/ci-build-only

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Runs as the app user; uses deploy.sh from the commit being deployed.
          inner='set -euo pipefail
          cd /srv/intellia360
          git -C repo.git fetch -q origin "+refs/heads/*:refs/heads/*"
          tmp=$(mktemp)
          trap "rm -f $tmp" EXIT
          git -C repo.git show "$1:deploy/deploy.sh" > "$tmp"
          bash "$tmp" "$1" </dev/null'
          cmd="sudo -u intellia -H -- bash -lc '${inner}' deploy ${SHA}"
          params=$(jq -n --arg c "$cmd" '{commands: [$c], executionTimeout: ["2400"]}')

          cid=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "intellia360 api deploy ${SHA::7}" \
            --parameters "$params" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName=/intellia360/deploy \
            --query Command.CommandId --output text)
          echo "SSM command: $cid"

          status=Pending
          for _ in $(seq 1 240); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "---- stderr ----"
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          echo "Deploy status: $status (full log: CloudWatch /intellia360/deploy)"
          [ "$status" = "Success" ]
