# Nginx site for the Intellia360 API on EC2 — reverse proxy in front of PM2
# (apps/backend, next start on 127.0.0.1:4000). Install as
# /etc/nginx/sites-available/intellia360 and symlink into sites-enabled
# (see docs/DEPLOYMENT-AWS.md).
#
# Traffic path:  browser ──HTTPS──▶ api.yourdomain.com: CloudFront (ACM cert)
#                ──HTTP──▶ Nginx :80 ──▶ Next.js API :4000
# (The frontend is a separate static site on S3 + its own CloudFront.)
#
# Port 80 is reachable only from CloudFront (EC2 security group allows the
# "com.amazonaws.global.cloudfront.origin-facing" managed prefix list), and every
# request must also carry the secret X-Origin-Verify header that CloudFront adds.

# ── Real client IP ───────────────────────────────────────────────────────────
# The app's rate limiter and audit log take the FIRST X-Forwarded-For entry as
# the client IP. CloudFront appends to whatever the viewer sent, so passing that
# header through would let a client pick its own rate-limit key. Instead use the
# viewer address CloudFront reports (CloudFront-Viewer-Address = "ip:port",
# forwarded by the origin request policy) and overwrite both headers with it.
map $http_cloudfront_viewer_address $client_ip {
    "~^(?<ip>.+):[0-9]+$"  $ip;
    default                $remote_addr;
}

upstream intellia360_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Rejects anything that did not come through CloudFront. The file holds:
    #   if ($http_x_origin_verify != "<secret>") { return 403; }
    # It lives only on the server so the secret is never committed.
    include /etc/nginx/snippets/intellia360-origin-verify.conf;

    # Editor saves send whole lesson/curriculum JSON documents.
    client_max_body_size 10m;

    access_log /var/log/nginx/intellia360.access.log;
    error_log  /var/log/nginx/intellia360.error.log warn;

    location / {
        proxy_pass http://intellia360_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # CloudFront forwards the viewer's Host and Origin (origin request policy
        # "AllViewerAndCloudFrontHeaders"): the API's CORS check needs Origin.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        # CloudFront redirects every viewer to HTTPS, so the viewer protocol is
        # always https. Sending $scheme ("http" on this hop) would trigger the
        # app's own HTTP→HTTPS redirect (next.config.ts) in an endless loop.
        proxy_set_header X-Forwarded-Proto https;

        # AI tutor / planner calls wait on an external model.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
